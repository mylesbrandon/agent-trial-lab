name: Docker Linux evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Complete benchmark with the documented CLI
        run: python -m runner.docker_benchmark --results-root work/docker-ci/reference
      - name: Verify scores, suite timeouts, and container cleanup
        run: python scripts/verify_docker_workflow.py --results-root work/docker-ci
      - name: Upload Docker evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-linux-evidence
          path: work/docker-ci
